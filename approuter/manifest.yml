---
applications:
  - name: ne-onesap-hub-app
    memory: 256M
    disk_quota: 512M
    instances: 1
    buildpacks:
      - nodejs_buildpack
    command: node server.js
    health-check-type: http
    health-check-http-endpoint: /health
    routes:
      - route: ne-onesap-hub.cfapps.us10.hana.ondemand.com
    services:
      - ne-hub-uaa
    env:
      APPROUTER_EXTERNAL_URL: https://ne-onesap-hub.cfapps.us10.hana.ondemand.com
      destinations: >
        [{"name":"ne-hub-static",
          "url":"https://ne-onesap-hub-static.cfapps.us10.hana.ondemand.com"}]
