<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SAP MaxAttention — Northeast</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "72", "SAP72", Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #00144A 0%, #002A86 60%, #0070F2 100%);
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
    }

    svg.sap-logo { height: 48px; }

    .title {
      text-align: center;
      color: #fff;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
    }

    .subtitle {
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      text-align: center;
      margin-top: -12px;
    }

    .lookup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 360px;
      padding: 0 24px;
    }

    #account-input {
      width: 100%;
      padding: 13px 18px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      font-size: 15px;
      color: #fff;
      outline: none;
      text-align: center;
      transition: border-color .15s, background .15s;
    }
    #account-input::placeholder { color: rgba(255,255,255,0.4); }
    #account-input:focus {
      border-color: #4CB1FF;
      background: rgba(255,255,255,0.15);
    }

    #enter-btn {
      width: 100%;
      background: #4CB1FF;
      color: #00144A;
      border: none;
      border-radius: 8px;
      padding: 13px 32px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
    }
    #enter-btn:hover { opacity: 0.88; }
    #enter-btn:disabled { opacity: 0.4; cursor: default; }

    #msg {
      font-size: 12px;
      min-height: 18px;
      text-align: center;
      color: rgba(255,255,255,0.5);
    }
    #msg.error { color: #FF8A80; }
  </style>
</head>
<body>

  <!-- SAP wordmark -->
  <svg class="sap-logo" viewBox="0 0 72 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="SAP">
    <rect width="72" height="36" rx="5" fill="#F0AB00"/>
    <text x="36" y="25" text-anchor="middle" font-family="Arial,sans-serif"
          font-weight="900" font-size="22" fill="#fff" letter-spacing="1.5">SAP</text>
  </svg>

  <div style="text-align:center">
    <div class="title">MaxAttention Northeast</div>
    <div class="subtitle" style="margin-top:8px">Account Dashboard Hub</div>
  </div>

  <div class="lookup">
    <input id="account-input" type="text" placeholder="Enter account name…"
           autocomplete="off" spellcheck="false">
    <button id="enter-btn" onclick="goToDashboard()">Enter Dashboard →</button>
    <div id="msg"></div>
  </div>

  <script>
    let customers = [];

    fetch('./customers.json')
      .then(r => r.json())
      .then(data => { customers = data; });

    const input = document.getElementById('account-input');
    const msg   = document.getElementById('msg');

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') goToDashboard();
      msg.className = '';
      msg.textContent = '';
    });

    function goToDashboard() {
      const q = input.value.trim().toLowerCase();
      if (!q) return;

      const match = customers.find(c =>
        c.name.toLowerCase() === q ||
        c.slug.toLowerCase() === q ||
        c.name.toLowerCase().includes(q)
      );

      if (match) {
        msg.className = '';
        msg.textContent = 'Opening ' + match.name + '…';
        setTimeout(() => { window.location.href = match.url; }, 300);
      } else {
        msg.className = 'error';
        msg.textContent = 'Account not found. Check the name and try again.';
        input.focus();
        input.select();
      }
    }
  </script>
</body>
</html>
