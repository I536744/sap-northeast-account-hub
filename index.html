<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>One SAP — Account Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "72", "SAP72", Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #00144A 0%, #002A86 60%, #0070F2 100%);
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
    }

    img.sap-logo { height: 48px; }

    .title { text-align: center; color: #fff; font-size: 32px; font-weight: 700; }
    .subtitle { color: rgba(255,255,255,0.6); font-size: 14px; text-align: center; margin-top: 6px; }

    .lookup {
      width: 100%;
      max-width: 420px;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Dropdown trigger ── */
    .dropdown { position: relative; width: 100%; }

    #dd-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      color: rgba(255,255,255,0.45);
      font-size: 15px;
      cursor: pointer;
      text-align: left;
      transition: border-color .15s, background .15s;
      gap: 8px;
    }
    #dd-btn.has-value { color: #fff; }
    #dd-btn:hover, #dd-btn.open {
      border-color: #4CB1FF;
      background: rgba(255,255,255,0.15);
    }
    #dd-btn .chevron {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      opacity: 0.6;
      transition: transform .2s;
    }
    #dd-btn.open .chevron { transform: rotate(180deg); }

    /* ── Dropdown panel ── */
    #dd-panel {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0; right: 0;
      background: #001A5C;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      z-index: 200;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    #dd-panel.open { display: block; }

    #dd-search {
      width: 100%;
      padding: 11px 14px;
      background: rgba(255,255,255,0.07);
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    #dd-search::placeholder { color: rgba(255,255,255,0.35); }

    #dd-list {
      max-height: 240px;
      overflow-y: auto;
    }
    #dd-list::-webkit-scrollbar { width: 4px; }
    #dd-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

    .dd-item {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
      color: rgba(255,255,255,0.85);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .dd-item:last-child { border-bottom: none; }
    .dd-item:hover, .dd-item.active { background: rgba(76,177,255,0.18); color: #fff; }
    .dd-item .item-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dd-item .item-sub { font-size: 11px; color: rgba(255,255,255,0.38); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
    .dd-item mark { background: none; color: #4CB1FF; font-weight: 700; }
    .live-badge {
      font-size: 10px;
      font-weight: 700;
      color: #4CB1FF;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #dd-empty {
      padding: 14px;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      text-align: center;
      display: none;
    }

    /* ── CTA button ── */
    #enter-btn {
      width: 100%;
      background: #4CB1FF;
      color: #00144A;
      border: none;
      border-radius: 10px;
      padding: 13px 32px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
    }
    #enter-btn:hover:not(:disabled) { opacity: 0.88; }
    #enter-btn:disabled { opacity: 0.35; cursor: default; }

    #msg { font-size: 12px; min-height: 18px; text-align: center; color: rgba(255,255,255,0.5); }
    #msg.error { color: #FF8A80; }
    #msg.ok { color: #69F0AE; }
  </style>
</head>
<body>

  <img class="sap-logo" src="./sap-logo.svg" alt="SAP">

  <div style="text-align:center">
    <div class="title">One SAP</div>
    <div class="subtitle">Account Dashboard Hub</div>
  </div>

  <div class="lookup">
    <div class="dropdown">
      <button id="dd-btn" onclick="toggleDropdown()">
        <span id="dd-label">Select an account…</span>
        <svg class="chevron" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 6l4 4 4-4" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div id="dd-panel">
        <input id="dd-search" type="text" placeholder="Search accounts…"
               autocomplete="off" spellcheck="false">
        <div id="dd-list"></div>
        <div id="dd-empty">No accounts found</div>
      </div>
    </div>

    <button id="enter-btn" onclick="goToDashboard()" disabled>Go to Dashboard →</button>
    <div id="msg"></div>
  </div>

  <script>
    let allAccounts = [];
    let customers   = [];
    let selected    = null;
    let activeIdx   = -1;
    let isOpen      = false;

    Promise.all([
      fetch('./accounts.json').then(r => r.json()),
      fetch('./customers.json').then(r => r.json())
    ]).then(([accs, custs]) => {
      allAccounts = accs;
      customers   = custs;
    });

    const ddBtn    = document.getElementById('dd-btn');
    const ddPanel  = document.getElementById('dd-panel');
    const ddSearch = document.getElementById('dd-search');
    const ddList   = document.getElementById('dd-list');
    const ddEmpty  = document.getElementById('dd-empty');
    const ddLabel  = document.getElementById('dd-label');
    const enterBtn = document.getElementById('enter-btn');
    const msg      = document.getElementById('msg');

    function toggleDropdown() {
      isOpen ? closeDropdown() : openDropdown();
    }

    function openDropdown() {
      isOpen = true;
      ddBtn.classList.add('open');
      ddPanel.classList.add('open');
      ddSearch.value = '';
      renderList('');
      setTimeout(() => ddSearch.focus(), 50);
    }

    function closeDropdown() {
      isOpen = false;
      ddBtn.classList.remove('open');
      ddPanel.classList.remove('open');
      activeIdx = -1;
    }

    document.addEventListener('click', e => {
      if (!e.target.closest('.dropdown')) closeDropdown();
    });

    ddSearch.addEventListener('input', () => {
      activeIdx = -1;
      renderList(ddSearch.value.trim());
    });

    ddSearch.addEventListener('keydown', e => {
      const items = ddList.querySelectorAll('.dd-item');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeIdx = Math.min(activeIdx + 1, items.length - 1);
        highlightItem(items);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeIdx = Math.max(activeIdx - 1, 0);
        highlightItem(items);
      } else if (e.key === 'Enter') {
        if (activeIdx >= 0 && items[activeIdx]) items[activeIdx].click();
      } else if (e.key === 'Escape') {
        closeDropdown();
      }
    });

    function renderList(q) {
      const lower = q.toLowerCase();
      let matches = q.length === 0
        ? allAccounts.slice(0, 50)
        : allAccounts.filter(a => a.name.toLowerCase().includes(lower)).slice(0, 50);

      // put LIVE accounts first
      matches.sort((a, b) => {
        const aLive = customers.some(c => c.name.toLowerCase() === a.name.toLowerCase()) ? 0 : 1;
        const bLive = customers.some(c => c.name.toLowerCase() === b.name.toLowerCase()) ? 0 : 1;
        return aLive - bLive;
      });

      if (!matches.length) {
        ddList.innerHTML = '';
        ddEmpty.style.display = 'block';
        return;
      }
      ddEmpty.style.display = 'none';

      ddList.innerHTML = matches.map((a, i) => {
        const nameHtml = q
          ? a.name.replace(new RegExp(`(${escRe(q)})`, 'gi'), '<mark>$1</mark>')
          : a.name;
        const live = customers.find(c => c.name.toLowerCase() === a.name.toLowerCase());
        const sub  = a.parent && a.parent !== a.name ? a.parent : '';
        return `<div class="dd-item" data-idx="${i}" onclick="selectAccount(${JSON.stringify(a).replace(/"/g,'&quot;')})">
          <span class="item-name">${nameHtml}</span>
          ${sub ? `<span class="item-sub">${sub}</span>` : ''}
          ${live ? '<span class="live-badge">● LIVE</span>' : ''}
        </div>`;
      }).join('');
    }

    function highlightItem(items) {
      items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
      if (items[activeIdx]) items[activeIdx].scrollIntoView({ block: 'nearest' });
    }

    function selectAccount(a) {
      selected = a;
      ddLabel.textContent = a.name;
      ddBtn.classList.add('has-value');
      closeDropdown();
      enterBtn.disabled = false;
      msg.className = '';
      msg.textContent = '';
    }

    function goToDashboard() {
      if (!selected) return;
      const live = customers.find(c => c.name.toLowerCase() === selected.name.toLowerCase());
      if (live) {
        msg.className = 'ok';
        msg.textContent = 'Opening ' + live.name + '…';
        setTimeout(() => { window.location.href = live.url; }, 250);
      } else {
        msg.className = 'error';
        msg.textContent = 'No dashboard deployed yet for ' + selected.name + '.';
      }
    }

    function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  </script>
</body>
</html>
