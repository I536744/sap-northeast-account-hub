<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SAP MaxAttention — Northeast</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "72", "SAP72", Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #00144A 0%, #002A86 60%, #0070F2 100%);
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
    }

    img.sap-logo { height: 48px; }

    .title { text-align: center; color: #fff; font-size: 32px; font-weight: 700; line-height: 1.2; }
    .subtitle { color: rgba(255,255,255,0.6); font-size: 14px; text-align: center; margin-top: -12px; }

    .lookup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 400px;
      padding: 0 24px;
      position: relative;
    }

    #account-input {
      width: 100%;
      padding: 13px 18px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      font-size: 15px;
      color: #fff;
      outline: none;
      transition: border-color .15s, background .15s;
    }
    #account-input::placeholder { color: rgba(255,255,255,0.4); }
    #account-input:focus { border-color: #4CB1FF; background: rgba(255,255,255,0.15); }

    #suggestions {
      position: absolute;
      top: 54px;
      left: 24px;
      right: 24px;
      background: #001A5C;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }
    #suggestions::-webkit-scrollbar { width: 4px; }
    #suggestions::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

    .suggestion {
      padding: 10px 16px;
      cursor: pointer;
      font-size: 13px;
      color: rgba(255,255,255,0.85);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      line-height: 1.3;
    }
    .suggestion:last-child { border-bottom: none; }
    .suggestion:hover, .suggestion.active { background: rgba(76,177,255,0.2); color: #fff; }
    .suggestion small { display: block; color: rgba(255,255,255,0.4); font-size: 11px; margin-top: 1px; }
    .suggestion mark { background: none; color: #4CB1FF; font-weight: 700; }

    #enter-btn {
      width: 100%;
      background: #4CB1FF;
      color: #00144A;
      border: none;
      border-radius: 8px;
      padding: 13px 32px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
    }
    #enter-btn:hover:not(:disabled) { opacity: 0.88; }
    #enter-btn:disabled { opacity: 0.35; cursor: default; }

    #msg { font-size: 12px; min-height: 18px; text-align: center; color: rgba(255,255,255,0.5); }
    #msg.error { color: #FF8A80; }
    #msg.ok { color: #69F0AE; }
  </style>
</head>
<body>

  <img class="sap-logo" src="./sap-logo.svg" alt="SAP">

  <div style="text-align:center">
    <div class="title">MaxAttention Northeast</div>
    <div class="subtitle" style="margin-top:8px">Account Dashboard Hub</div>
  </div>

  <div class="lookup">
    <input id="account-input" type="text" placeholder="Search for an account…"
           autocomplete="off" spellcheck="false">
    <div id="suggestions"></div>
    <button id="enter-btn" onclick="goToDashboard()" disabled>Enter Dashboard →</button>
    <div id="msg"></div>
  </div>

  <script>
    let allAccounts = [];   // from accounts.json  (all 11k accounts)
    let customers   = [];   // from customers.json  (accounts with live dashboards)
    let selected    = null;
    let activeIdx   = -1;

    Promise.all([
      fetch('./accounts.json').then(r => r.json()),
      fetch('./customers.json').then(r => r.json())
    ]).then(([accs, custs]) => {
      allAccounts = accs;
      customers   = custs;
    });

    const input   = document.getElementById('account-input');
    const sugBox  = document.getElementById('suggestions');
    const btn     = document.getElementById('enter-btn');
    const msg     = document.getElementById('msg');

    input.addEventListener('input', () => {
      selected = null;
      btn.disabled = true;
      msg.className = '';
      msg.textContent = '';
      const q = input.value.trim();
      if (q.length < 2) { hideSug(); return; }
      showSuggestions(q);
    });

    input.addEventListener('keydown', e => {
      const items = sugBox.querySelectorAll('.suggestion');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeIdx = Math.min(activeIdx + 1, items.length - 1);
        highlight(items);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeIdx = Math.max(activeIdx - 1, 0);
        highlight(items);
      } else if (e.key === 'Enter') {
        if (activeIdx >= 0 && items[activeIdx]) {
          items[activeIdx].click();
        } else if (selected) {
          goToDashboard();
        }
      } else if (e.key === 'Escape') {
        hideSug();
      }
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('.lookup')) hideSug();
    });

    function showSuggestions(q) {
      const lower = q.toLowerCase();
      const matches = allAccounts
        .filter(a => a.name.toLowerCase().includes(lower))
        .slice(0, 8);

      if (!matches.length) { hideSug(); return; }

      activeIdx = -1;
      sugBox.innerHTML = matches.map((a, i) => {
        const hi = a.name.replace(new RegExp(`(${escRe(q)})`, 'gi'), '<mark>$1</mark>');
        const live = customers.find(c => c.name.toLowerCase() === a.name.toLowerCase());
        return `<div class="suggestion" data-idx="${i}" onclick="selectAccount(${JSON.stringify(a).replace(/"/g,'&quot;')})">
          ${hi}${live ? ' <span style="color:#4CB1FF;font-size:10px;font-weight:700;">● LIVE</span>' : ''}
          <small>${a.parent !== a.name ? a.parent : ''}</small>
        </div>`;
      }).join('');
      sugBox.style.display = 'block';
    }

    function highlight(items) {
      items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
      if (items[activeIdx]) items[activeIdx].scrollIntoView({ block: 'nearest' });
    }

    function hideSug() { sugBox.style.display = 'none'; activeIdx = -1; }

    function selectAccount(a) {
      selected = a;
      input.value = a.name;
      hideSug();
      btn.disabled = false;
      msg.className = '';
      msg.textContent = '';
      input.blur();
    }

    function goToDashboard() {
      if (!selected) return;
      const live = customers.find(c => c.name.toLowerCase() === selected.name.toLowerCase());
      if (live) {
        msg.className = 'ok';
        msg.textContent = 'Opening ' + live.name + '…';
        setTimeout(() => { window.location.href = live.url; }, 250);
      } else {
        msg.className = 'error';
        msg.textContent = 'No dashboard deployed yet for ' + selected.name + '.';
      }
    }

    function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  </script>
</body>
</html>
